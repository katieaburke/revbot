name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The Prisma client is generated code that backend sources import types from.
      # Without this, typecheck fails on every @prisma/client import rather than on
      # anything real.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
